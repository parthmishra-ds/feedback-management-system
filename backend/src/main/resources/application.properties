spring.application.name=college-feedback

# ---- Database (Tier 3). JDBC address of the database. Override with environment variables. ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/college_feedback?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USER:feedback_app}
spring.datasource.password=${DB_PASSWORD:ChangeMe#2026}

# Tables come from database/schema.sql, never from Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- Session cookie ----
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.port=${PORT:8080}

# ---- Management account created on first start (see AdminBootstrap) ----
app.admin.institutional-id=${ADMIN_ID:ADMIN001}
app.admin.name=${ADMIN_NAME:Management Admin}
app.admin.password=${ADMIN_PASSWORD:}

# ---- Alerts: email and SMS. Both are OFF by default: the text is only written to the server log (safe for demos). ----
# Email (any SMTP server, e.g. Gmail with an App Password): set NOTIFY_EMAIL=true plus the MAIL_* variables.
app.notify.email.enabled=${NOTIFY_EMAIL:false}
app.notify.email.from=${MAIL_FROM:no-reply@feedback.local}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# SMS through Twilio's REST API: set NOTIFY_SMS=true plus the TWILIO_* variables.
app.notify.sms.enabled=${NOTIFY_SMS:false}
app.notify.sms.twilio.account-sid=${TWILIO_SID:}
app.notify.sms.twilio.auth-token=${TWILIO_TOKEN:}
app.notify.sms.twilio.from=${TWILIO_FROM:}
